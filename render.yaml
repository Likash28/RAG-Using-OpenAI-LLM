services:
  - type: web
    name: rag-application
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CHROMA_DIR
        value: ./chroma_db
      - key: CLIP_EMBEDDER
        value: openai/clip-vit-base-patch32
      - key: GEMINI_API_KEY
        value: your_gemini_api_key_here
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: LOG_DIR
        value: ./logs
      - key: MAX_TOKENS
        value: "1000"
      - key: PROD_LOG_LEVEL
        value: INFO
      - key: PROVIDER
        value: gemini
      - key: SQLITE_PATH
        value: ./facts.db
      - key: TEXT_EMBEDDER
        value: all-MiniLM-L6-v2
      - key: TOP_K
        value: "3"
