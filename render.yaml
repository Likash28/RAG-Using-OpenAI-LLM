services:
  - type: web
    name: rag-application
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CHROMA_DIR
        value: ./chroma_db
      - key: BLIP_EMBEDDER
        value: Salesforce/blip-itm-base-coco
      - key: PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        value: your_openai_api_key_here
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LOG_DIR
        value: ./logs
      - key: MAX_TOKENS
        value: "1000"
      - key: PROD_LOG_LEVEL
        value: INFO
      - key: SQLITE_PATH
        value: ./facts.db
      - key: TEXT_EMBEDDER
        value: all-MiniLM-L6-v2
      - key: TOP_K
        value: "3"
